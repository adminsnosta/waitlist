name: publish nosta waitlist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: check out waitlist files
        uses: actions/checkout@v6
      - name: configure pages
        uses: actions/configure-pages@v5
      - name: upload the public site folder
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: publish to github pages
        id: deployment
        uses: actions/deploy-pages@v4
